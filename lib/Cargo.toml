[package]
name = "lib_klipper"
version = "0.12.2"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "7"
lexical-core = "^0.7"
serde = { version = "^1", features = ["derive"] }
glam = { version = "0.20", features = ["serde"] }
