[package]
name = "lib_klipper"
version = "0.5.0"
edition = "2018"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "7"
lexical-core = "^0.7"
serde = { version = "^1", features = ["derive"] }
glam = { version = "0.20", features = ["serde"] }
